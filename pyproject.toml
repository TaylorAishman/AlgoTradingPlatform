[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atp"
version = "0.1.0"
description = "Algorithmic trading platform"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "cvxpy",
    "alpaca-py",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[project.scripts]
atp = "atp.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Design documents and references are not Python sources; ruff must not rewrite code blocks in them.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

# Strict typing for atp.core (the flags of --strict; per-module sections cannot set --strict itself).
[[tool.mypy.overrides]]
module = ["atp.core", "atp.core.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# Third-party packages without usable type information.
[[tool.mypy.overrides]]
module = [
    "cvxpy", "cvxpy.*",
    "scipy", "scipy.*",
    "sklearn", "sklearn.*",
    "pyarrow", "pyarrow.*",
    "alpaca", "alpaca.*",
    "pandas", "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not alpaca and not slow'"
markers = [
    "alpaca: needs the live Alpaca API; deselected by default",
    "slow: long-running; deselected by default",
]
