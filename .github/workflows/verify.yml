name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A change must not edit the checks that judge it, unless a human
      # labelled the PR judge-change.
      - name: Judge files unchanged
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'judge-change')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          hits="$(printf '%s\n' "$changed" | grep -E '^(REVIEW\.md|\.devteam/|\.github/workflows/)' || true)"
          if [ -n "$hits" ]; then
            echo "::error::This PR changes judge files without the judge-change label:"
            printf '%s\n' "$hits"
            exit 1
          fi

      # One ticket, one PR. Design-doc PRs are exempt.
      - name: PR links one ticket
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'design/') && !contains(github.event.pull_request.labels.*.name, 'judge-change')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          count="$(printf '%s' "$PR_BODY" | grep -Eoi '(closes|fixes|resolves) #[0-9]+' | sort -u | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "::error::PR body must close exactly one ticket (found $count)."
            exit 1
          fi

      # TODO: add toolchain setup for this project here (setup-node, setup-python, ...).

      - name: Verify
        run: ./.devteam/verify.sh
