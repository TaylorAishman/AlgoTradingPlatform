# Example secrets file for the Alpaca paper trading API.
#
# Each user brings their own keys. Copy this file to `config/.secrets.toml`
# (hidden and gitignored, so it never reaches the repository), fill in your
# keys, and make it private:
#
#   cp config/secrets.example.toml config/.secrets.toml
#   chmod 600 config/.secrets.toml
#   export PT_SECRETS_FILE="$PWD/config/.secrets.toml"
#
# The binary refuses a secrets file that group or others can read (mode must
# be 600 or 400), and never prints the values. Keys come from the Alpaca
# dashboard's paper account; the binary only talks to the paper trading host.
#
# Alternatively, export APCA_API_KEY_ID and APCA_API_SECRET_KEY; they take
# precedence over this file.

key_id = "YOUR_PAPER_KEY_ID"
secret_key = "YOUR_PAPER_SECRET_KEY"
